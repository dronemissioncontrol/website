<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register | Fleet107</title>
<link rel="stylesheet" href="auth.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="top"><a class="logo" href="index.html">FLEET<span>107</span></a></div>
<div class="box">
  <div class="card">
    <h1>Create account</h1>
    <p class="sub">Register as a pilot or a client.</p>
    <form id="form">
      <label for="name">Full name</label>
      <input id="name" type="text" required autocomplete="name">
      <label for="role">I am a</label>
      <select id="role" required>
        <option value="client">Client</option>
        <option value="pilot">Pilot</option>
      </select>
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="email">
      <label for="password">Password (min 8 characters)</label>
      <input id="password" type="password" required minlength="8" autocomplete="new-password">
      <button id="btn" type="submit">Register</button>
      <div id="msg" class="msg"></div>
    </form>
    <p class="alt">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</div>
<script src="config.js"></script>
<script>
const form = document.getElementById("form");
const msg = document.getElementById("msg");
const btn = document.getElementById("btn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  msg.className = "msg"; msg.textContent = "";
  btn.disabled = true;

  const { data, error } = await sb.auth.signUp({
    email: document.getElementById("email").value.trim(),
    password: document.getElementById("password").value,
    options: {
      data: {
        full_name: document.getElementById("name").value.trim(),
        role: document.getElementById("role").value
      },
      emailRedirectTo: window.location.origin + "/dashboard.html"
    }
  });

  btn.disabled = false;
  if (error) {
    msg.className = "msg err";
    msg.textContent = error.message;
    return;
  }
  if (data.session) {
    window.location.href = "dashboard.html";
  } else {
    msg.className = "msg ok";
    msg.textContent = "Check your email to confirm your account, then log in.";
    form.reset();
  }
});
</script>
</body>
</html>
